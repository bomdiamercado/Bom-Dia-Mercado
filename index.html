<title>Bom Dia Mercado - 18 de Setembro de 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Merriweather:wght@400;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #f0f2f5;
    color: #2c3e50;
    line-height: 1.7;
    font-size: 15px;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #1a3a52 0%, #0d2137 100%);
    padding: 24px 20px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(245,166,35,0.08) 0%, transparent 70%);
    border-radius: 50%;
  }

  .header-content {
    max-width: 800px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .logo-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 16px;
  }

  .logo-text {
    font-size: 28px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -0.5px;
    text-transform: uppercase;
  }

  .logo-text span {
    color: #f5a623;
  }

  .header-date {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .header-edition {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 1px;
  }

  /* HEADLINE BANNER */
  .headline-banner {
    background: linear-gradient(135deg, #f5a623 0%, #e8941a 100%);
    padding: 20px;
    text-align: center;
  }

  .headline-banner h1 {
    font-family: 'Merriweather', serif;
    font-size: 22px;
    font-weight: 700;
    color: #1a3a52;
    line-height: 1.3;
    max-width: 700px;
    margin: 0 auto;
  }

  .headline-banner .subtitle {
    font-size: 14px;
    color: rgba(26,58,82,0.75);
    margin-top: 8px;
    font-weight: 500;
  }

  .byline {
    font-size: 12px;
    color: rgba(26,58,82,0.6);
    margin-top: 10px;
    font-style: italic;
  }

  /* MAIN CONTAINER */
  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 20px 16px;
  }

  /* COTAÇÕES PANEL */
  .quotes-panel {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .quote-card {
    background: #ffffff;
    border-radius: 12px;
    padding: 16px 14px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border: 1px solid rgba(0,0,0,0.04);
    position: relative;
    overflow: hidden;
  }

  .quote-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
  }

  .quote-card.up::before { background: #27ae60; }
  .quote-card.down::before { background: #e74c3c; }
  .quote-card.neutral::before { background: #f5a623; }

  .quote-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #7f8c8d;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .quote-value {
    font-size: 20px;
    font-weight: 800;
    color: #1a3a52;
    line-height: 1.2;
  }

  .quote-change {
    font-size: 12px;
    font-weight: 700;
    margin-top: 4px;
  }

  .quote-change.positive { color: #27ae60; }
  .quote-change.negative { color: #e74c3c; }

  .quote-detail {
    font-size: 10px;
    color: #95a5a6;
    margin-top: 2px;
  }

  /* LIDE / OPENING */
  .lide-card {
    background: linear-gradient(135deg, #1a3a52, #1e4a66);
    border-radius: 14px;
    padding: 28px 24px;
    margin-bottom: 24px;
    color: #ffffff;
    position: relative;
    overflow: hidden;
  }

  .lide-card::after {
    content: '';
    position: absolute;
    bottom: -30px;
    right: -30px;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, rgba(245,166,35,0.12) 0%, transparent 70%);
    border-radius: 50%;
  }

  .lide-card p {
    font-size: 15px;
    line-height: 1.8;
    color: rgba(255,255,255,0.92);
    position: relative;
    z-index: 1;
  }

  .lide-card p strong {
    color: #f5a623;
  }

  /* SECTION CARDS */
  .section-card {
    background: #ffffff;
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    border: 1px solid rgba(0,0,0,0.04);
    overflow: hidden;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 22px;
    border-bottom: 1px solid #f0f2f5;
    position: relative;
  }

  .section-header::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
  }

  .section-header.boj::before { background: #e74c3c; }
  .section-header.petroleo::before { background: #2c3e50; }
  .section-header.juros::before { background: #2980b9; }
  .section-header.eleicoes::before { background: #f5a623; }
  .section-header.dolar::before { background: #27ae60; }
  .section-header.bolsa::before { background: #8e44ad; }
  .section-header.eua::before { background: #3498db; }
  .section-header.master::before { background: #c0392b; }
  .section-header.cias::before { background: #16a085; }
  .section-header.agenda::before { background: #f39c12; }
  .section-header.destaques::before { background: #1a3a52; }

  .section-icon {
    font-size: 22px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    flex-shrink: 0;
  }

  .section-icon.boj { background: #fde8e8; }
  .section-icon.petroleo { background: #ebeef0; }
  .section-icon.juros { background: #e8f0fe; }
  .section-icon.eleicoes { background: #fef5e0; }
  .section-icon.dolar { background: #e8f8ef; }
  .section-icon.bolsa { background: #f0e8f8; }
  .section-icon.eua { background: #e8f0fe; }
  .section-icon.master { background: #fde8e8; }
  .section-icon.cias { background: #e0f7f1; }
  .section-icon.agenda { background: #fef5e0; }
  .section-icon.destaques { background: #e8edf2; }

  .section-title {
    font-size: 16px;
    font-weight: 800;
    color: #1a3a52;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .section-subtitle {
    font-size: 11px;
    color: #95a5a6;
    font-weight: 500;
  }

  .section-body {
    padding: 20px 22px 22px;
  }

  .section-body p {
    margin-bottom: 14px;
    color: #34495e;
    font-size: 14.5px;
    line-height: 1.75;
  }

  .section-body p:last-child {
    margin-bottom: 0;
  }

  .section-body p strong {
    color: #1a3a52;
    font-weight: 700;
  }

  .bullet-item {
    padding-left: 16px;
    position: relative;
    margin-bottom: 12px;
  }

  .bullet-item::before {
    content: '▸';
    position: absolute;
    left: 0;
    color: #f5a623;
    font-weight: 700;
  }

  /* DI TABLE */
  .di-table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0 8px;
    font-size: 13px;
  }

  .di-table th {
    background: #1a3a52;
    color: #ffffff;
    padding: 10px 14px;
    text-align: left;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .di-table th:first-child {
    border-radius: 8px 0 0 0;
  }

  .di-table th:last-child {
    border-radius: 0 8px 0 0;
  }

  .di-table td {
    padding: 10px 14px;
    border-bottom: 1px solid #f0f2f5;
    font-weight: 500;
  }

  .di-table tr:nth-child(even) {
    background: #f9fafb;
  }

  .di-table tr:last-child td:first-child {
    border-radius: 0 0 0 8px;
  }

  .di-table tr:last-child td:last-child {
    border-radius: 0 0 8px 0;
  }

  .di-table .down-val {
    color: #27ae60;
    font-weight: 700;
  }

  /* HIGHLIGHT BOX */
  .highlight-box {
    background: linear-gradient(135deg, #fef9f0, #fef5e0);
    border-left: 4px solid #f5a623;
    border-radius: 0 10px 10px 0;
    padding: 16px 20px;
    margin: 16px 0;
    font-size: 14px;
  }

  .highlight-box.blue {
    background: linear-gradient(135deg, #f0f5fa, #e8f0fe);
    border-left-color: #2980b9;
  }

  .highlight-box.red {
    background: linear-gradient(135deg, #fdf2f2, #fde8e8);
    border-left-color: #e74c3c;
  }

  .highlight-box.green {
    background: linear-gradient(135deg, #f0faf5, #e8f8ef);
    border-left-color: #27ae60;
  }

  .highlight-box p {
    margin-bottom: 0 !important;
    color: #2c3e50;
    font-weight: 500;
  }

  /* AGENDA */
  .agenda-list {
    list-style: none;
  }

  .agenda-list li {
    padding: 12px 0;
    border-bottom: 1px solid #f0f2f5;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 14px;
  }

  .agenda-list li:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .agenda-flag {
    font-size: 20px;
    flex-shrink: 0;
    width: 30px;
    text-align: center;
  }

  .agenda-time {
    font-weight: 700;
    color: #f5a623;
    min-width: 48px;
    font-size: 13px;
    flex-shrink: 0;
  }

  .agenda-text {
    color: #34495e;
    line-height: 1.6;
  }

  /* CIAS LIST */
  .cia-item {
    padding: 14px 0;
    border-bottom: 1px solid #f0f2f5;
  }

  .cia-item:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .cia-name {
    font-weight: 800;
    color: #1a3a52;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: inline;
  }

  .cia-text {
    color: #34495e;
    font-size: 14px;
    line-height: 1
