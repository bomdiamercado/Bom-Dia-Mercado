<title>Bom Dia Mercado - 18 de Setembro de 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Merriweather:wght@400;700&display=swap');

  :root {
    --azul-escuro: #1a3a52;
    --azul-medio: #234e6f;
    --azul-claro: #2c6491;
    --laranja: #f5a623;
    --laranja-escuro: #d4911e;
    --laranja-claro: #fdb94d;
    --branco: #ffffff;
    --cinza-claro: #f4f6f8;
    --cinza-medio: #e2e6ea;
    --cinza-texto: #6b7a8d;
    --texto-escuro: #1a2332;
    --verde: #22c55e;
    --verde-escuro: #16a34a;
    --vermelho: #ef4444;
    --vermelho-escuro: #dc2626;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #eef1f5;
    color: var(--texto-escuro);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
    background: var(--branco);
    box-shadow: 0 0 40px rgba(0,0,0,0.08);
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--azul-escuro) 0%, var(--azul-medio) 50%, var(--azul-claro) 100%);
    padding: 28px 32px 24px;
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(245,166,35,0.08) 0%, transparent 70%);
    border-radius: 50%;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-text {
    display: flex;
    flex-direction: column;
  }

  .logo-text .title {
    font-size: 26px;
    font-weight: 900;
    color: var(--branco);
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  .logo-text .subtitle {
    font-size: 13px;
    font-weight: 500;
    color: var(--laranja);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .header-date {
    text-align: right;
    color: rgba(255,255,255,0.75);
    font-size: 13px;
    font-weight: 500;
    line-height: 1.5;
  }

  .header-date strong {
    color: var(--branco);
    font-size: 14px;
  }

  .header-headline {
    position: relative;
    z-index: 1;
    border-top: 1px solid rgba(255,255,255,0.15);
    padding-top: 18px;
    margin-top: 4px;
  }

  .header-headline h1 {
    font-family: 'Merriweather', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--branco);
    line-height: 1.35;
    margin-bottom: 6px;
  }

  .header-headline h1 span {
    color: var(--laranja);
  }

  .header-headline .byline {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  /* COTAÇÕES PAINEL */
  .cotacoes-bar {
    background: var(--azul-escuro);
    border-bottom: 3px solid var(--laranja);
    padding: 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .cotacoes-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    min-width: 600px;
  }

  .cotacao-item {
    padding: 16px 20px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.08);
    transition: background 0.2s;
  }

  .cotacao-item:last-child {
    border-right: none;
  }

  .cotacao-item:hover {
    background: rgba(255,255,255,0.03);
  }

  .cotacao-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--laranja);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
  }

  .cotacao-valor {
    font-size: 20px;
    font-weight: 800;
    color: var(--branco);
    line-height: 1.2;
  }

  .cotacao-variacao {
    font-size: 12px;
    font-weight: 600;
    margin-top: 3px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px 8px;
    border-radius: 10px;
  }

  .cotacao-variacao.positiva {
    color: #4ade80;
    background: rgba(74, 222, 128, 0.1);
  }

  .cotacao-variacao.negativa {
    color: #f87171;
    background: rgba(248, 113, 113, 0.1);
  }

  /* CONTEÚDO PRINCIPAL */
  .content {
    padding: 0;
  }

  .intro-section {
    padding: 28px 32px;
    background: linear-gradient(180deg, var(--cinza-claro) 0%, var(--branco) 100%);
    border-bottom: 1px solid var(--cinza-medio);
  }

  .intro-section p {
    font-size: 15px;
    line-height: 1.8;
    color: #3a4a5c;
    text-align: justify;
  }

  /* SEÇÕES */
  .section {
    padding: 28px 32px;
    border-bottom: 1px solid var(--cinza-medio);
  }

  .section:last-of-type {
    border-bottom: none;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }

  .section-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
  }

  .section-icon.juros { background: linear-gradient(135deg, #6366f1, #818cf8); }
  .section-icon.dolar { background: linear-gradient(135deg, #16a34a, #22c55e); }
  .section-icon.bolsa { background: linear-gradient(135deg, var(--azul-claro), #3b82f6); }
  .section-icon.eleicoes { background: linear-gradient(135deg, #dc2626, #f97316); }
  .section-icon.petroleo { background: linear-gradient(135deg, #1a3a52, #475569); }
  .section-icon.petrobras { background: linear-gradient(135deg, #059669, #10b981); }
  .section-icon.boj { background: linear-gradient(135deg, #dc2626, #fbbf24); }
  .section-icon.master { background: linear-gradient(135deg, #7c3aed, #a78bfa); }
  .section-icon.cias { background: linear-gradient(135deg, #0891b2, #22d3ee); }
  .section-icon.agenda { background: linear-gradient(135deg, var(--laranja-escuro), var(--laranja)); }

  .section-title-group {
    display: flex;
    flex-direction: column;
  }

  .section-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--cinza-texto);
  }

  .section-title {
    font-family: 'Merriweather', serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--azul-escuro);
    line-height: 1.3;
  }

  .section p, .section .bullet {
    font-size: 14.5px;
    line-height: 1.8;
    color: #3a4a5c;
    margin-bottom: 12px;
    text-align: justify;
  }

  .section .bullet {
    padding-left: 16px;
    position: relative;
  }

  .section .bullet::before {
    content: '•';
    position: absolute;
    left: 0;
    color: var(--laranja);
    font-weight: 800;
    font-size: 16px;
  }

  .section .bullet:last-child {
    margin-bottom: 0;
  }

  .highlight-box {
    background: linear-gradient(135deg, #fef9ee 0%, #fefce8 100%);
    border-left: 4px solid var(--laranja);
    padding: 16px 20px;
    border-radius: 0 8px 8px 0;
    margin: 16px 0;
    font-size: 14px;
    color: #78350f;
    line-height: 1.7;
  }

  .highlight-box strong {
    color: #92400e;
  }

  .data-box {
    background: var(--cinza-claro);
    border-radius: 8px;
    padding: 16px 20px;
    margin: 16px 0;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--azul-escuro);
  }

  .data-box .data-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px dashed rgba(0,0,0,0.08);
  }

  .data-box .data-row:last-child {
    border-bottom: none;
  }

  .data-box .data-label {
    font-weight: 600;
    color: var(--azul-medio);
  }

  .data-box .data-value {
    font-weight: 700;
    font-family: 'Inter', monospace;
  }

  .data-value.down { color: var(--verde-escuro); }
  .data-value.up { color: var(--vermelho-escuro); }

  /* AGENDA */
  .agenda-section {
    background: var(--cinza-claro);
  }

  .agenda-list {
    list-style: none;
  }

  .agenda-list li {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(0,0,0,0.05);
    font-size: 14px;
    line-height: 1.6;
    color: #3a4a5c;
    align-items: flex-start;
  }

  .agenda-list li:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .agenda-flag {
    font-size: 20px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .agenda-time {
    font-weight: 700;
    color: var(--azul-escuro);
    white-space: nowrap;
    min-width: 48px;
  }

  /* DESTAQUES DA NOITE */
  .destaques-section {
    background: linear-gradient(180deg, #1e293b 0%, var(--azul-escuro) 100%);
    color: var(--branco);
    padding: 28px 32px;
  }

  .destaques-section .section-title {
    color: var(--branco);
  }

  .destaques-section .section-tag {
    color: var(--laranja-claro);
  }

  .destaque-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 12px;
    transition: background 0.2s;
  }

  .destaque-card:hover {
    background: rgba(255,255,255,0.09);
  }

  .destaque-card:last-child {
    margin-bottom: 0;
  }

  .destaque-time {
    font-size: 11px;
    font-weight: 700;
    color: var(--laranja);
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .destaque-titulo {
    font-size: 14px;
    font-weight: 700;
    color: var(--branco);
    line-height: 1.4;
    margin-bottom: 6px;
  }

  .destaque-resumo {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    line-height: 1.6;
  }

  /* CIAS ABERTAS */
  .cia-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--cinza-medio);
    font-size: 14px;
