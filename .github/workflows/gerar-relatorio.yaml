name: Gerar Bom Dia Mercado

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install anthropic

      - name: Gerar relatório
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python gerar.py

      - name: Publicar index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bom Dia Mercado: ${{ github.event.issue.title }}" || echo "Sem mudanças"
          git push

      - name: Fechar a issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close ${{ github.event.issue.number }} --comment "Relatório publicado em https://bomdiamercado.github.io/Bom-Dia-Mercado/"
