name: Gerar Relatório

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar HTML
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TITULO: ${{ github.event.issue.title }}
          TEXTO: ${{ github.event.issue.body }}
        run: python gerar.py

      - name: Injetar og:image no index.html
        run: |
          if ! grep -q 'og:image' index.html; then
            sed -i 's|<meta property="og:type"|<meta property="og:image" content="https://bomdiamercado.github.io/Bom-Dia-Mercado/preview.png">\n  <meta property="og:image:width" content="1200">\n  <meta property="og:image:height" content="630">\n  <meta property="og:type"|' index.html
          fi

      - name: Injetar og:image no dolar.html
        run: |
          if ! grep -q 'og:image' dolar.html; then
            sed -i 's|<meta property="og:type"|<meta property="og:image" content="https://bomdiamercado.github.io/Bom-Dia-Mercado/dolar-preview.png">\n  <meta property="og:image:width" content="1200">\n  <meta property="og:image:height" content="630">\n  <meta property="og:type"|' dolar.html
          fi

      - name: Commit e push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html dolar.html
          git diff --cached --quiet || git commit -m "Relatório: ${{ github.event.issue.title }}"
          git push

      - name: Apagar corpo da issue e fechar
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '',
              state: 'closed'
            });
