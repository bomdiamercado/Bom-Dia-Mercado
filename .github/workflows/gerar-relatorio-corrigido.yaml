name: Gerar Relatório

on:
  issues:
    types: [opened]

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Gerar HTML
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python gerar.py

      - name: Inject og:image tag
        run: |
          if grep -q "og:image" index.html; then
            echo "og:image tag already present"
          else
            sed -i '/<\/head>/i\    <meta property="og:image" content="https://bomdiamercado.github.io/Bom-Dia-Mercado/preview.png">' index.html
            sed -i '/<\/head>/i\    <meta property="og:image:width" content="1200">' index.html
            sed -i '/<\/head>/i\    <meta property="og:image:height" content="630">' index.html
          fi

      - name: Commit e push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git commit -m "Atualizar Bom Dia Mercado"
          git push

      - name: Apagar corpo da issue e fechar
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '',
              state: 'closed'
            })
